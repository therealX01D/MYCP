name: Release Docker Image

# Manual only: run from the Actions tab -> "Run workflow"
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.0, without the leading v)"
        required: true
        type: string
      confirm_version:
        description: "Type the version again to confirm"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false
      attach_tarball:
        description: "Also attach the image as a .tar.gz release asset (large)"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write   # create tag + release
  packages: write   # push to GHCR

# Never run two releases at the same time
concurrency:
  group: release-docker
  cancel-in-progress: false

jobs:
  # ---- Gate 1: cheap checks that run before anything is built or approved ----
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only allow runs from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases can only be run from main (got ${{ github.ref }})"
          exit 1

      - name: Versions must match (typo guard)
        run: |
          if [ "${{ inputs.version }}" != "${{ inputs.confirm_version }}" ]; then
            echo "Version and confirmation do not match"
            exit 1
          fi

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must not exist and version must increase
        run: |
          VERSION="${{ inputs.version }}"

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists"
            exit 1
          fi

          LATEST=$(git tag --list 'v[0-9]*' | grep -v -- '-' | sort -V | tail -n1 || true)
          if [ -n "$LATEST" ]; then
            HIGHEST=$(printf '%s\n%s\n' "${LATEST#v}" "${VERSION%%-*}" | sort -V | tail -n1)
            if [ "$HIGHEST" != "${VERSION%%-*}" ]; then
              echo "Version ${VERSION} is lower than latest release ${LATEST}"
              exit 1
            fi
          fi

  # ---- Gate 2: human approval via the "production" environment ----
  release:
    needs: guard
    runs-on: ubuntu-latest
    # Configure required reviewers + "main only" deployment branch on this
    # environment in Settings -> Environments. The run pauses until approved.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ !inputs.prerelease }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64   # drop arm64 if you don't need it
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Export image tarball (optional)
        if: ${{ inputs.attach_tarball }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --output type=docker,dest=image.tar .
          gzip image.tar
          mv image.tar.gz "image-${{ inputs.version }}.tar.gz"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          DIGEST="${{ steps.build.outputs.digest }}"

          cat > notes.md <<EOF
          ## Docker image

          \`\`\`
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          Digest: \`${DIGEST}\`
          EOF

          ARGS=(--title "v${VERSION}" --notes-file notes.md --generate-notes --target "${{ github.sha }}")
          if [ "${{ inputs.prerelease }}" = "true" ]; then ARGS+=(--prerelease); fi

          FILES=()
          if [ "${{ inputs.attach_tarball }}" = "true" ]; then
            FILES+=("image-${VERSION}.tar.gz")
          fi

          gh release create "v${VERSION}" "${FILES[@]}" "${ARGS[@]}"